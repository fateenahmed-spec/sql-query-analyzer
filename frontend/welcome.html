<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="description" content="From query to execution plan to insight with QueryLens.">
  <title>QueryLens — AI-assisted SQL analyzer</title>
  <script>
    try {
      if (localStorage.getItem("query-lens-theme") === "dark") document.documentElement.dataset.theme = "dark";
    } catch (_) { /* Storage may be unavailable. */ }
  </script>
  <link rel="stylesheet" href="/welcome.css">
</head>
<body>
  <div class="welcome-page">
    <header class="welcome-header">
      <div class="brand-lockup" aria-label="QueryLens, AI-assisted SQL analyzer">
        <span class="brand-mark" aria-hidden="true">Σ</span>
        <span class="brand-copy"><strong>QueryLens</strong><small>AI-assisted SQL analyzer</small></span>
      </div>
    </header>

    <main class="welcome-main">
      <div class="lens-art lens-art-desktop" aria-hidden="true">
        <img class="lens-image" src="/assets/welcome-lens.svg" alt="" width="468" height="460" decoding="async">
      </div>
      <div class="lens-art lens-art-mobile" aria-hidden="true">
        <img class="lens-image" src="/assets/welcome-lens-mobile.svg" alt="" width="239" height="248" decoding="async">
      </div>
      <section class="welcome-hero" aria-labelledby="welcome-heading">
        <p class="hero-label"><span class="label-dot" aria-hidden="true"></span>UNDERSTAND YOUR DATABASE</p>
        <h1 id="welcome-heading">
          <span class="desktop-headline">See what your SQL<br>is really doing.</span>
          <span class="mobile-headline">See what your<br>SQL is really<br>doing.</span>
        </h1>
        <p class="hero-description">From query to execution plan to insight.</p>
        <div class="hero-action">
          <a class="primary-action" href="/index.html">Enter QueryLens →</a>
          <p class="feature-line">Interactive Execution Plans · Beginner-Friendly Insights · AI-Assisted Analysis</p>
        </div>
      </section>
    </main>
  </div>
  <script>
    document.querySelectorAll(".lens-art").forEach((lens) => {
      lens.addEventListener("pointermove", (event) => {
        const bounds = lens.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return;
        lens.style.setProperty("--pointer-x", `${((event.clientX - bounds.left) / bounds.width) * 100}%`);
        lens.style.setProperty("--pointer-y", `${((event.clientY - bounds.top) / bounds.height) * 100}%`);
        lens.classList.add("is-active");
      }, { passive: true });
      lens.addEventListener("pointerleave", () => lens.classList.remove("is-active"));
    });
  </script>
</body>
</html>
